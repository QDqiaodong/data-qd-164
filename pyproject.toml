[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-164"
version = "0.1.0"
description = "Round-robin fixture schedules with venue and team availability constraints"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
fixture-scheduler = "fixture_scheduler.cli:main"
fixture-repair = "fixture_scheduler.repair:main"
fixture-standings = "fixture_scheduler.standings:main"
[tool.setuptools.packages.find]
where = ["src"]
